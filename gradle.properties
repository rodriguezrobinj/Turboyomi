kotlin.code.style=official

# Configuration should be synced with [/gradle/build-logic/gradle.properties]
org.gradle.caching=true
org.gradle.isolated-projects=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.tooling.parallel=true

# CI: setup-java's JDK 25 for the packaging toolchain (spec 10c); elsewhere Gradle finds the installed JDKs
org.gradle.java.installations.fromEnv=JAVA_HOME_25_X64
