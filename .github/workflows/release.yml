name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write
      # Provenance: with no signing certificate yet, `gh attestation verify` proves an MSI came from this workflow
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The version comes from the tag (spec 6a §2)
          fetch-depth: 0
      - uses: ./.github/actions/setup-turboyomi
        with:
          tracker-keys: ${{ secrets.TRACKER_KEYS }}
      - run: ./gradlew spotlessCheck test --continue
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: test-reports
          path: "**/build/reports/tests/test/"
      - run: ./gradlew :desktop-app:packageMsi :desktop-app:packageZip -Paot=true
      - name: Sign
        # Skipped until there's a certificate (spec 6b §1)
        if: env.SIGNING_CERT_BASE64 != ''
        env:
          SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          echo "$SIGNING_CERT_BASE64" | base64 -d > "$RUNNER_TEMP/cert.pfx"
          signtool="$(ls "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/signtool.exe | tail -1)"
          "$signtool" sign //f "$RUNNER_TEMP/cert.pfx" //p "$SIGNING_CERT_PASSWORD" //fd SHA256 \
            //tr http://timestamp.digicert.com //td SHA256 desktop-app/build/packaging/*.msi
      - name: Checksums
        working-directory: desktop-app/build/packaging
        # "<hash>  <file>", which AppUpdater reads
        run: sha256sum Turboyomi-*.msi Turboyomi-*.zip > SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            desktop-app/build/packaging/Turboyomi-*.msi
            desktop-app/build/packaging/Turboyomi-*.zip
      - name: Release
        working-directory: desktop-app/build/packaging
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Turboyomi ${GITHUB_REF_NAME#v}" --generate-notes \
            Turboyomi-*.msi Turboyomi-*.zip SHA256SUMS
