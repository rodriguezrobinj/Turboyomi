name: dependencies

on:
  push:
    branches: [master]
  pull_request:
  # A Dependabot auto-merge pushes with GITHUB_TOKEN, which starts no push run, so the graph also refreshes weekly
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependencies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dependabot can't read Gradle's resolved graph on its own: this sends it, so alerts and the review see every library
  submit:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            25
            23
      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

  review:
    if: github.event_name == 'pull_request'
    needs: submit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          retry-on-snapshot-warnings: true
          comment-summary-in-pr: on-failure
