name: compat

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

# The harness runs third-party extension code: give it a read-only token and keep it out of .git/config
permissions:
  contents: read

jobs:
  compat:
    runs-on: windows-latest
    if: ${{ vars.COMPAT_REPO_URL != '' }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: build/cef
          key: cef-jbr-release-25.0.4b508.27
      - name: Run harness
        env:
          COMPAT_REPO_URL: ${{ vars.COMPAT_REPO_URL }}
        run: ./gradlew :compat-harness:run --args="--repo $COMPAT_REPO_URL --limit 100 --threshold 0.8 --out $GITHUB_WORKSPACE/compat-report.md --cef $GITHUB_WORKSPACE/build/cef"
      - name: Publish report
        if: always()
        run: cat compat-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compat-report
          path: compat-report.md
