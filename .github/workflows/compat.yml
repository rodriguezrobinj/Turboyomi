name: compat

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

# The harness runs third-party extension code: give it a read-only token and keep it out of .git/config
permissions:
  contents: read

jobs:
  compat:
    runs-on: windows-latest
    if: ${{ vars.COMPAT_REPO_URL != '' }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # The app image's version comes from the last v* tag (spec 6a §2)
          fetch-depth: 0
      - uses: ./.github/actions/setup-turboyomi
      # The harness runs on the packaged runtime, so a JDK module it lacks shows up here (spec 6a §3 C)
      - run: ./gradlew :desktop-app:appImage
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/cef
          key: cef-jbr-release-25.0.4b508.27
      - name: Run harness
        env:
          COMPAT_REPO_URL: ${{ vars.COMPAT_REPO_URL }}
        run: |
          java="$GITHUB_WORKSPACE/desktop-app/build/packaging/image/Turboyomi/runtime/bin/java.exe"
          ./gradlew :compat-harness:run "-PharnessJava=$java" --args="--repo $COMPAT_REPO_URL --limit 100 --threshold 0.8 --out $GITHUB_WORKSPACE/compat-report.md --cef $GITHUB_WORKSPACE/build/cef"
      - name: Publish report
        if: always()
        run: cat compat-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: compat-report
          path: compat-report.md
