name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # The version comes from the last v* tag (spec 6a §2)
          fetch-depth: 0
      - uses: ./.github/actions/setup-turboyomi
        with:
          tracker-keys: ${{ secrets.TRACKER_KEYS }}
      - run: bash scripts/check-licenses.sh
      - run: ./gradlew spotlessCheck test --continue
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: "**/build/reports/tests/test/"
      - run: bash scripts/check-no-android.sh
      - uses: actions/cache@v4
        with:
          path: build/cef
          key: cef-jbr-release-25.0.4b508.27
      - run: ./gradlew :desktop-core:cefTest
      - run: ./gradlew :desktop-app:packageMsi :desktop-app:packageZip
      - uses: actions/upload-artifact@v4
        with:
          name: turboyomi
          path: |
            desktop-app/build/packaging/*.msi
            desktop-app/build/packaging/*.zip
