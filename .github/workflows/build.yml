name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version comes from the last v* tag (spec 6a §2)
          fetch-depth: 0
      - uses: ./.github/actions/setup-turboyomi
        with:
          tracker-keys: ${{ secrets.TRACKER_KEYS }}
      - run: bash scripts/check-licenses.sh
      - run: ./gradlew spotlessCheck test --continue
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-reports
          path: "**/build/reports/tests/test/"
      - run: bash scripts/check-no-android.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/cef
          key: cef-jbr-release-25.0.4b508.27
      - name: Embedded browser tests
        # The real CEF, without a display: it sometimes crashes natively on GitHub's runners, so it reports and doesn't
        # block the packages; it runs reliably on a desktop
        continue-on-error: true
        run: ./gradlew :desktop-core:cefTest
      - run: ./gradlew :desktop-app:packageMsi :desktop-app:packageZip -Paot=true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: turboyomi
          path: |
            desktop-app/build/packaging/*.msi
            desktop-app/build/packaging/*.zip
